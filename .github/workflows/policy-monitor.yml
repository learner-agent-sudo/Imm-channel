name: IRCC policy monitor

on:
  schedule:
    # Twice a week — IRCC draws typically land on Tuesdays/Wednesdays.
    - cron: "0 14 * * 2,4"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check IRCC feeds
        id: monitor
        run: |
          node scripts/policy-monitor.mjs | tee monitor-report.md
          cat monitor-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open review issue when something changed
        if: steps.monitor.outputs.changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('monitor-report.md', 'utf8');
            const title = `Policy monitor: IRCC changes detected (${new Date().toISOString().slice(0, 10)})`;
            // Reuse an open monitor issue if one exists to avoid noise.
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'policy-monitor',
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['policy-monitor'],
              });
            }

# Dependency update PRs. Security fixes arrive as soon as an advisory is
# published (once Dependabot security updates are enabled in Settings);
# routine version updates wait a week after release, the window in which
# compromised npm releases are usually caught and pulled.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Major versions (e.g. eslint 10, vitest 5) change APIs and need a
    # hands-on migration, so they aren't proposed automatically. This also
    # applies to security updates — a fix that needs a major upgrade has to
    # be done by hand.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
